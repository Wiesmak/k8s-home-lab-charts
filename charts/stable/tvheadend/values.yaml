#
# IMPORTANT NOTE
#
# This chart inherits from our common library chart. You can check the default values/options here:
# https://github.com/k8s-home-lab/helm-charts/blob/master/charts/stable/common/values.yaml
#

image:
  # -- image repository
  repository: ghcr.io/tvheadend/tvheadend
  # -- image tag
  tag: "latest@sha256:51afe3dc68b2426c85ca3713d38e31b651537d1f119d5e660348dbc76e435054"
  # -- image pull policy
  pullPolicy: IfNotPresent

# -- environment variables. See [image docs](https://docs.linuxserver.io/images/docker-tvheadend#environment-variables-e) for more details.
# @default -- See below
env:
  # -- Set the container timezone
  TZ: UTC

# Use this for the first run, remove after setting password
# args: ["--config", "/var/lib/tvheadend", "--noacl"]

args: ["--config", "/var/lib/tvheadend"]


# -- Configures service settings for the chart.
# @default -- See values.yaml
service:
  main:
    ports:
      http:
        port: 9981
      htsp:
        enabled: true
        protocol: TCP
        port: 9982

ingress:
  # -- Enable and configure ingress settings for the chart under this key.
  # @default -- See values.yaml
  main:
    enabled: false

# -- Configure persistence settings for the chart under this key.
# @default -- See values.yaml
persistence:
  config:
    enabled: false
    mountPath: /var/lib/tvheadend
  recordings:
    enabled: false
    mountPath: /var/lib/tvheadend/recordings

probes:
  startup:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /ping
        port: http
      periodSeconds: 5
      failureThreshold: 24
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /ping
        port: http
      periodSeconds: 10
      failureThreshold: 3
  liveness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /ping
        port: http
      periodSeconds: 20
      failureThreshold: 3